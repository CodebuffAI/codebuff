name: CLI Release Prod

on:
  workflow_dispatch:
    inputs:
      version_type:
        description: 'Version bump type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

concurrency:
  group: cli-prod-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate-release-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - uses: ./.github/actions/setup-project

      - name: Validate release source
        shell: bash
        run: |
          set -euo pipefail
          bun scripts/check-env-architecture.ts
          bun run --cwd sdk build
          bun run --cwd cli prebuild:agents
          bun run --cwd cli typecheck
          HOME="$RUNNER_TEMP/openbuff-test-home" bun run --cwd cli test

  prepare-and-commit-prod:
    needs: validate-release-source
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      new_version: ${{ steps.bump_version.outputs.new_version }}
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main

      - uses: ./.github/actions/setup-project

      - name: Calculate and update production version
        id: bump_version
        run: |
          cd cli/release

          # Get current version and bump it
          CURRENT_VERSION=$(bun -e "console.log(require('./package.json').version)")
          echo "Current version: $CURRENT_VERSION"

          # Bump version based on input
          npm version ${{ inputs.version_type }} --no-git-tag-version
          NEW_VERSION=$(bun -e "console.log(require('./package.json').version)")

          echo "New production version: $NEW_VERSION"
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Configure git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit and push version bump
        run: |
          git stash
          git pull --rebase origin main
          git stash pop
          git add cli/release/package.json
          git commit -m "Bump version to ${{ steps.bump_version.outputs.new_version }}"
          git push

      - name: Create and push production tag
        run: |
          git tag "v${{ steps.bump_version.outputs.new_version }}"
          git push origin "v${{ steps.bump_version.outputs.new_version }}"

      - name: Upload updated package
        uses: actions/upload-artifact@v7
        with:
          name: updated-package
          path: cli/release/

  build-prod-binaries:
    needs: prepare-and-commit-prod
    uses: ./.github/workflows/cli-release-build.yml
    with:
      binary-name: openbuff
      new-version: ${{ needs.prepare-and-commit-prod.outputs.new_version }}
      artifact-name: updated-package
      checkout-ref: v${{ needs.prepare-and-commit-prod.outputs.new_version }}
      env-overrides: '{"NEXT_PUBLIC_CB_ENVIRONMENT": "prod"}'
    secrets:
      OPENBUFF_GITHUB_TOKEN: ${{ secrets.OPENBUFF_GITHUB_TOKEN }}

  # Create GitHub release with all binaries
  create-prod-release:
    needs: [prepare-and-commit-prod, build-prod-binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v6

      - name: Download all binary artifacts
        uses: actions/download-artifact@v8
        with:
          path: binaries/

      - name: Download updated package
        uses: actions/download-artifact@v8
        with:
          name: updated-package
          path: cli/release/

      - name: Generate release checksums
        shell: bash
        run: |
          set -euo pipefail
          : > SHA256SUMS
          while IFS= read -r file; do
            checksum=$(sha256sum "$file" | awk '{print $1}')
            printf '%s  %s\n' "$checksum" "$(basename "$file")" >> SHA256SUMS
          done < <(find binaries -type f -name 'openbuff-*.tar.gz' | sort)
          test -s SHA256SUMS

      - name: Attest release binaries
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'binaries/*/openbuff-*.tar.gz'

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare-and-commit-prod.outputs.new_version }}
          name: Release v${{ needs.prepare-and-commit-prod.outputs.new_version }}
          prerelease: false
          body: |
            ## Openbuff v${{ needs.prepare-and-commit-prod.outputs.new_version }}

            Binary releases for all supported platforms.

            ### Installation
            ```bash
            npm install -g @openbuff/cli
            ```

            ### Platform Binaries
            - `openbuff-linux-x64.tar.gz` - Linux x64
            - `openbuff-linux-arm64.tar.gz` - Linux ARM64
            - `openbuff-darwin-x64.tar.gz` - macOS 13+ Intel
            - `openbuff-darwin-x64-legacy.tar.gz` - macOS 11–12 Intel
            - `openbuff-darwin-arm64.tar.gz` - macOS 13+ Apple Silicon
            - `openbuff-win32-x64.tar.gz` - Windows x64
          files: |
            binaries/*/openbuff-*
            SHA256SUMS
          repository: AnzoBenjamin/openbuff
          token: ${{ secrets.OPENBUFF_GITHUB_TOKEN }}

  # Publish npm package
  publish-prod-npm:
    needs: [prepare-and-commit-prod, create-prod-release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - name: Download updated package
        uses: actions/download-artifact@v8
        with:
          name: updated-package
          path: cli/release/

      - name: Set up Node.js for npm publishing
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/

      - name: Publish to npm
        run: |
          cd cli/release
          npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
