name: Freebuff Desktop Release

# Builds the Freebuff Desktop Electron app for macOS (arm64 + Intel), Windows,
# and Linux, then publishes the installers to a public GitHub Release so users
# can download them. Mirrors the CLI release flow (freebuff-release.yml), but
# uses electron-builder instead of `bun build --compile`.

on:
  workflow_dispatch:
    inputs:
      version_type:
        description: 'Version bump type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
      checkout_ref:
        description: 'Git ref to build from (commit SHA, branch, or tag). Defaults to latest main.'
        required: false
        default: ''
        type: string

concurrency:
  group: freebuff-desktop-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  prepare-and-commit:
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.bump_version.outputs.new_version }}
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ inputs.checkout_ref || '' }}

      - uses: ./.github/actions/setup-project

      - name: Calculate and update version
        id: bump_version
        run: |
          cd freebuff-desktop

          CURRENT_VERSION=$(bun -e "console.log(require('./package.json').version)")
          echo "Current version: $CURRENT_VERSION"

          # Use a bun script rather than `npm version`: freebuff-desktop is a
          # member of the root Bun workspace, so npm resolves the whole
          # workspace and dies on the sibling package `@codebuff/.agents`
          # ("name cannot start with a period").
          NEW_VERSION=$(bun scripts/bump-version.ts ${{ inputs.version_type }})

          echo "New Freebuff Desktop version: $NEW_VERSION"
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Configure git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit and push version bump
        run: |
          git stash
          git pull --rebase origin main
          git stash pop
          git add freebuff-desktop/package.json
          git commit -m "Bump Freebuff Desktop version to ${{ steps.bump_version.outputs.new_version }}"
          git push

      - name: Create and push tag
        run: |
          git tag "freebuff-desktop-v${{ steps.bump_version.outputs.new_version }}"
          git push origin "freebuff-desktop-v${{ steps.bump_version.outputs.new_version }}"

  build:
    needs: prepare-and-commit
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: mac-arm64
          - os: macos-15-intel
            target: mac-x64
          - os: windows-latest
            target: win-x64
          - os: ubuntu-latest
            target: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}

      - uses: ./.github/actions/setup-project

      - name: Stamp release version
        shell: bash
        working-directory: freebuff-desktop
        run: |
          # See prepare-and-commit for why this uses a bun script, not npm.
          bun scripts/bump-version.ts ${{ needs.prepare-and-commit.outputs.new_version }}

      - name: Configure environment variables
        env:
          SECRETS_CONTEXT: ${{ toJSON(secrets) }}
          # FREEBUFF_MODE is read by the orchestrator at runtime; the
          # NEXT_PUBLIC_* vars are baked into the orchestrator bundle at build
          # time (see freebuff-desktop/scripts/build-orchestrator.ts).
          ENV_OVERRIDES: '{"FREEBUFF_MODE": "true", "NEXT_PUBLIC_CB_ENVIRONMENT": "prod"}'
        shell: bash
        run: |
          VAR_NAMES=$(bun scripts/generate-ci-env.ts --scope client)

          echo "$SECRETS_CONTEXT" | jq -r --argjson vars "$VAR_NAMES" '
            to_entries | .[] | select(.key as $k | $vars | index($k)) | .key + "=" + .value
          ' >> $GITHUB_ENV
          echo "CODEBUFF_GITHUB_ACTIONS=true" >> $GITHUB_ENV
          echo "$ENV_OVERRIDES" | jq -r 'to_entries | .[] | .key + "=" + .value' >> $GITHUB_ENV

      - name: Stage app (UI + icons + Bun + orchestrator)
        shell: bash
        working-directory: freebuff-desktop
        run: bun run prepackage

      # macOS Developer ID signing + notarization is auto-gating: it activates
      # only when the APPLE_* secrets are present. Until they are, this step is
      # a no-op and the build falls back to the ad-hoc-unsigned path below. The
      # same wiring works for an individual OR an organization cert — switching
      # identity is purely a matter of overwriting these six secrets, no code
      # change. See freebuff-desktop/docs/code-signing.md.
      - name: Configure macOS signing
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_CERT_P12_BASE64" ]; then
            echo "No APPLE_* signing secrets set — building UNSIGNED (ad-hoc)."
            echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "Signing secrets present — configuring Developer ID sign + notarize."
          echo "$APPLE_CERT_P12_BASE64"    | base64 --decode > "$RUNNER_TEMP/cert.p12"
          echo "$APPLE_API_KEY_P8_BASE64"  | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          {
            # electron-builder imports this .p12 into a throwaway keychain itself.
            echo "CSC_LINK=$RUNNER_TEMP/cert.p12"
            echo "CSC_KEY_PASSWORD=$APPLE_CERT_PASSWORD"
            echo "CSC_IDENTITY_AUTO_DISCOVERY=true"
            # @electron/notarize (App Store Connect API key) reads these:
            echo "APPLE_API_KEY=$RUNNER_TEMP/AuthKey.p8"
            echo "APPLE_API_KEY_ID=$APPLE_API_KEY_ID"
            echo "APPLE_API_ISSUER_ID=$APPLE_API_ISSUER_ID"
            echo "APPLE_TEAM_ID=$APPLE_TEAM_ID"
            # Flag consumed by the package step and the ad-hoc-sign afterPack hook.
            echo "FREEBUFF_NOTARIZE=true"
          } >> "$GITHUB_ENV"

      - name: Package installer (electron-builder)
        shell: bash
        working-directory: freebuff-desktop
        env:
          # On Windows/Linux (no "Configure macOS signing" step) keep auto
          # identity discovery off. On macOS the step above sets this via
          # $GITHUB_ENV: false when unsigned, true when signing secrets exist.
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ env.CSC_IDENTITY_AUTO_DISCOVERY || 'false' }}
        run: |
          if [ "$FREEBUFF_NOTARIZE" = "true" ]; then
            echo "Packaging with Developer ID signing + notarization."
            bun run pack:ci -c.mac.notarize=true
          else
            bun run pack:ci
          fi

      - name: Collect installers
        shell: bash
        working-directory: freebuff-desktop
        run: |
          mkdir -p out
          # Only the distributable installers — skip the unpacked dir/, the
          # builder-debug.yml, etc.
          find dist -maxdepth 1 -type f \
            \( -name '*.dmg' -o -name '*.exe' -o -name '*.AppImage' \) \
            -exec cp {} out/ \;
          echo "Collected:" && ls -la out

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: freebuff-desktop-${{ matrix.target }}
          path: freebuff-desktop/out/*
          if-no-files-found: error

  create-release:
    needs: [prepare-and-commit, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download all installer artifacts
        uses: actions/download-artifact@v8
        with:
          path: installers/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: freebuff-desktop-v${{ needs.prepare-and-commit.outputs.new_version }}
          name: Freebuff Desktop v${{ needs.prepare-and-commit.outputs.new_version }}
          prerelease: true
          body: |
            ## Freebuff Desktop v${{ needs.prepare-and-commit.outputs.new_version }}

            Desktop app for the Freebuff coding agent. Download the installer for your platform:

            | Platform | File |
            | --- | --- |
            | macOS (Apple Silicon) | `Freebuff-${{ needs.prepare-and-commit.outputs.new_version }}-mac-arm64.dmg` |
            | macOS (Intel) | `Freebuff-${{ needs.prepare-and-commit.outputs.new_version }}-mac-x64.dmg` |
            | Windows (x64) | `Freebuff-${{ needs.prepare-and-commit.outputs.new_version }}-win-x64.exe` |
            | Linux (x64) | `Freebuff-${{ needs.prepare-and-commit.outputs.new_version }}-linux-x64.AppImage` |

            > **Note:** ${{ secrets.APPLE_CERT_P12_BASE64 != '' && 'macOS builds are signed with a Developer ID and notarized by Apple — no right-click-to-open needed.' || 'macOS builds are not yet code-signed; macOS users may need to right-click → Open (or allow it in System Settings → Privacy & Security).' }}
            > Windows builds are unsigned, so Windows users may see a SmartScreen warning.
          files: |
            installers/**/*.dmg
            installers/**/*.exe
            installers/**/*.AppImage
          repository: CodebuffAI/codebuff-community
          token: ${{ secrets.CODEBUFF_GITHUB_TOKEN }}
