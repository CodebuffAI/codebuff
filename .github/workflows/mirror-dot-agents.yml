name: Mirror subdir to dot-agents
# ┌─────────────────────────────────────────────────────────────────────────────
# │ DISABLED 2026-07-05 — target repo `AnzoBenjamin/openbuff-dot-agents` does   │
# │ not exist on GitHub, so every `git subtree push` here fails with exit 128   │
# │ ("remote: Repository not found"). The dot-agents bundle is already shipped │
# │ to users via the @openbuff/cli npm package (which seeds `.agents/` at      │
# │ runtime from common/src/templates/initial-agents-dir/), so the standalone  │
# │ mirror has no known consumer today.                                         │
# │                                                                            │
# │ To re-enable: create `AnzoBenjamin/openbuff-dot-agents` (public, default   │
# │ branch `main`), then run `gh workflow enable mirror-dot-agents.yml`.       │
# │ To remove permanently: delete this file.                                   │
# └─────────────────────────────────────────────────────────────────────────────
on:
  push:
    branches: [main]
    paths:
      - 'common/src/templates/initial-agents-dir/**'

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      # (belt-and-suspenders) ensure the injected header is gone even if persist-credentials isn't honored
      - name: Clear default GitHub auth header
        run: git config --global --unset-all http.https://github.com/.extraheader || true

      - name: Configure Git
        run: |
          git config user.name "openbuff mirror bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Push subtree
        env:
          TOKEN: ${{ secrets.OPENBUFF_GITHUB_TOKEN }}
        run: |
          git subtree push --prefix=common/src/templates/initial-agents-dir \
            https://x-access-token:${TOKEN}@github.com/AnzoBenjamin/openbuff-dot-agents.git \
            main
