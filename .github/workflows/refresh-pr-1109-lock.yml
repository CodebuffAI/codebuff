name: Refresh PR 1109 lockfile

on:
  push:
    branches:
      - fix/cli-typecheck-dependencies

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - name: Regenerate lockfile
        run: bun install --lockfile-only
      - name: Commit resolved lockfile
        shell: bash
        run: |
          rm .github/workflows/refresh-pr-1109-lock.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock .github/workflows/refresh-pr-1109-lock.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore(cli): refresh lockfile after latest main sync"
          git push origin HEAD:fix/cli-typecheck-dependencies
