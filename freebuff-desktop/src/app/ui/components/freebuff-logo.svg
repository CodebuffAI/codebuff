<svg viewBox="0 0 150 150" xmlns="http://www.w3.org/2000/svg">
  <!-- Rounded terminal-window frame: dark fill with cyan stroke (matches the
       brand mark used in freebuff/web/design/opengraph-image.svg). -->
  <rect x="6" y="6" width="138" height="138" rx="22" ry="22"
        fill="#0a0a0b" stroke="#67e8f9" stroke-width="4"/>

  <!-- Traffic-light dots on the title bar. -->
  <circle cx="28" cy="32" r="5" fill="#3a3e44"/>
  <circle cx="48" cy="32" r="5" fill="#3a3e44"/>
  <circle cx="68" cy="32" r="5" fill="#3a3e44"/>

  <!-- The "terminal guy": two eyes + a small smile, all in the brand cyan so
       the mascot reads as Freebuff, not as a generic smiley. -->
  <g fill="#67e8f9">
    <circle cx="60" cy="82" r="7"/>
    <circle cx="100" cy="82" r="7"/>
  </g>
  <path d="M58 104 Q80 122 102 104"
        fill="none" stroke="#67e8f9" stroke-width="5"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
