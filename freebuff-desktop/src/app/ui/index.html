<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Freebuff Desktop</title>
    <style>
      :root {
        /* Neutral grayscale canvas, Codex-style: near-black, no blue tint, hairline
           borders. Color is reserved strictly for interactive/status elements. */
        --bg: #0e0e0e;            /* near-black main canvas */
        --surface: #161616;       /* panels, cards, column heads */
        --surface-2: #1d1d1d;     /* hover / nested fills */
        --raised: #242424;        /* elevated surfaces — toasts, bubbles, help card */
        --border: #262626;        /* hairline dividers */
        --border-strong: #383838; /* control outlines, scrollbar */
        --text: #ececec;          /* neutral light text */
        --muted: #9b9b9b;         /* secondary text */
        --faint: #6a6a6a;         /* tertiary / labels */
        --accent: #7cff3f;        /* freebuff brand lime — the single interactive accent */
        --accent-dim: rgba(124, 255, 63, 0.1);
        --accent-line: rgba(124, 255, 63, 0.38);
        --green: #7f9b86;         /* calm sage — passive "done/verified", intentionally low-contrast */
        --green-line: rgba(127, 155, 134, 0.4);
        --amber: #d8a23a;         /* reserved for genuinely important warnings only */
        --red: var(--muted);      /* alarm red retired → neutral; status comes from layout, not color */
        --purple: var(--muted);   /* scout accent retired → neutral */
        --radius: 10px;
        --shadow: 0 1px 3px rgba(0, 0, 0, 0.4);
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        background: var(--bg);
        color: var(--text);
        font-size: 13.5px;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
        overflow: hidden;
      }
      button {
        font: inherit;
        cursor: pointer;
        border: none;
        border-radius: 8px;
        background: var(--accent);
        color: #08120a;
        font-weight: 600;
        padding: 8px 14px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        transition: filter 0.12s ease, background 0.12s ease;
      }
      button:hover { filter: brightness(1.08); }
      button:active { filter: brightness(0.95); }
      button:disabled { opacity: 0.45; cursor: default; }
      button.ghost { background: transparent; border: 1px solid var(--border-strong); color: var(--text); font-weight: 500; }
      button.ghost:hover { background: var(--surface-2); }
      button.green { background: var(--green); color: #08120a; }
      button.danger { background: transparent; border: 1px solid var(--border-strong); color: var(--muted); font-weight: 500; }
      button.danger:hover { background: var(--surface-2); color: var(--text); }
      button.sm { padding: 5px 10px; font-size: 12px; }
      a { color: var(--accent); text-decoration: none; }
      ::-webkit-scrollbar { width: 9px; height: 9px; }
      ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 6px; }
      ::-webkit-scrollbar-track { background: transparent; }

      /* ---- App shell ---- */
      #app { display: grid; grid-template-columns: 248px minmax(0, 1fr) 380px; height: 100vh; }
      @media (min-width: 1500px) { #app { grid-template-columns: 280px minmax(0, 1fr) 440px; } }
      .col { display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--border); background: var(--bg); }
      .col:last-child { border-right: none; }
      .col-head {
        height: 46px; flex: 0 0 46px; display: flex; align-items: center; gap: 8px;
        padding: 0 14px; border-bottom: 1px solid var(--border); font-weight: 650; font-size: 13px;
        background: var(--surface); letter-spacing: 0.2px;
      }
      .col-body { flex: 1; overflow-y: auto; min-height: 0; }

      /* segmented switcher (narrow only) */
      #tabs { display: none; }
      @media (max-width: 999px) {
        #app { grid-template-columns: 1fr; grid-template-rows: 44px 1fr; }
        #tabs { display: flex; grid-row: 1; border-bottom: 1px solid var(--border); background: var(--surface); padding: 6px; gap: 6px; }
        #tabs button { flex: 1; background: transparent; color: var(--muted); font-weight: 600; border-radius: 7px; padding: 6px; position: relative; }
        #tabs button.active { background: var(--raised); color: var(--text); }
        .col { grid-row: 2; border-right: none; display: none; }
        .col.active { display: flex; }
      }
      .tab-badge {
        position: absolute; top: 2px; right: 8px; background: var(--accent); color: #08120a;
        font-size: 9px; min-width: 15px; height: 15px; border-radius: 8px; padding: 0 4px;
        display: inline-flex; align-items: center; justify-content: center;
      }

      /* ---- Header brand ---- */
      .brand { display: flex; align-items: center; gap: 9px; }
      .proj { display: flex; flex-direction: column; line-height: 1.25; }
      .proj .name { font-size: 12.5px; font-weight: 650; }
      .proj .branch { font-size: 10.5px; color: var(--faint); font-weight: 500; }
      .activity { margin-left: auto; display: flex; gap: 10px; font-size: 11px; color: var(--muted); font-weight: 500; }
      .activity b { color: var(--text); font-weight: 650; }
      .pulse { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); margin-right: 6px; vertical-align: 1px; animation: pulse 1.3s ease-in-out infinite; }
      @keyframes pulse { 0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(124, 255, 63, 0.45); } 50% { opacity: 0.55; box-shadow: 0 0 0 4px rgba(124, 255, 63, 0); } }

      /* ---- Board ---- */
      .cta {
        margin: 10px; padding: 9px 11px; border-radius: var(--radius); cursor: pointer;
        background: var(--accent-dim); border: 1px solid var(--accent-line);
        color: var(--accent); font-size: 12px; font-weight: 600; display: flex; align-items: center; gap: 7px;
      }
      .cta:hover { background: rgba(124, 255, 63, 0.16); }
      .cta.scout-cta { background: var(--surface); border-color: var(--border-strong); color: var(--muted); margin-top: 6px; }
      .cta.scout-cta:hover { background: var(--surface-2); }
      .section-h { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--faint); margin: 14px 12px 5px; font-weight: 650; }
      .card {
        background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
        margin: 5px 10px; padding: 9px 11px; cursor: pointer; transition: border-color 0.12s ease;
      }
      .card:hover { border-color: var(--border-strong); }
      .card.sel { border-color: var(--accent); background: var(--surface-2); }
      .card.waiting { opacity: 0.62; }
      .card .ti { font-weight: 600; font-size: 12.5px; margin-bottom: 5px; }
      .card .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
      .badge { font-size: 10px; padding: 1.5px 7px; border-radius: 20px; font-weight: 600; border: 1px solid var(--border-strong); color: var(--muted); }
      .badge.dot::before { content: "●"; margin-right: 4px; font-size: 8px; vertical-align: 1px; }
      .badge.b-running { color: var(--accent); border-color: var(--accent-line); }
      .badge .elapsed { opacity: 0.7; font-variant-numeric: tabular-nums; }
      .badge.b-review { color: var(--green); border-color: var(--green-line); }
      .badge.b-merged { color: var(--faint); }
      .badge.b-blocked, .badge.b-failed { color: var(--muted); border-color: var(--border-strong); }
      .badge.b-waiting { color: var(--muted); border-color: var(--border-strong); }
      .badge.scout { color: var(--muted); border-color: var(--border-strong); }
      .badge.dep { color: var(--muted); }

      .docs-item { display: flex; align-items: center; gap: 8px; padding: 6px 12px; cursor: pointer; font-size: 12.5px; }
      .docs-item:hover { background: var(--surface-2); }
      .docs-item.sel { background: var(--surface-2); color: var(--accent); }
      .docs-item .pdot { width: 7px; height: 7px; border-radius: 50%; flex: 0 0 7px; background: var(--border-strong); }
      .docs-item.present .pdot { background: var(--green); }

      /* ---- Chat ---- */
      .chat { display: flex; flex-direction: column; height: 100%; }
      .chat-log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
      .kbd-hint { margin: 18px 12px 12px; font-size: 10.5px; color: var(--faint); line-height: 1.9; }
      .kbd-hint b { color: var(--muted); background: var(--surface-2); border: 1px solid var(--border); border-radius: 4px; padding: 0 4px; font-weight: 600; }
      .empty { margin: auto; max-width: 360px; text-align: center; color: var(--muted); }
      .empty h2 { color: var(--text); font-size: 16px; margin: 0 0 6px; font-weight: 650; }
      .empty p { font-size: 13px; margin: 0 0 16px; }
      .examples { display: flex; flex-direction: column; gap: 8px; }
      .ex { background: var(--surface); border: 1px solid var(--border); border-radius: 9px; padding: 9px 12px; font-size: 12.5px; cursor: pointer; color: var(--text); text-align: left; }
      .ex:hover { border-color: var(--accent); }
      .msg { max-width: 92%; }
      .msg.user { align-self: flex-end; }
      .bubble { padding: 9px 13px; border-radius: 12px; white-space: pre-wrap; word-break: break-word; }
      .msg.user .bubble { background: var(--raised); color: var(--text); border: 1px solid var(--border-strong); border-bottom-right-radius: 4px; }
      .msg.assistant .bubble { background: var(--surface); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
      .acts { display: flex; flex-direction: column; gap: 3px; margin: 2px 0; }
      .act { font-size: 11.5px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
      .act .ic { font-size: 12px; }
      .act.subtle { color: var(--faint); font-size: 11px; }
      .thinking { color: var(--faint); font-size: 12px; font-style: italic; }
      .composer { border-top: 1px solid var(--border); padding: 12px; background: var(--surface); }
      .composer .box { display: flex; gap: 8px; align-items: flex-end; }
      textarea {
        flex: 1; resize: none; background: var(--bg); color: var(--text); border: 1px solid var(--border-strong);
        border-radius: 10px; padding: 9px 11px; font: inherit; font-size: 13px; max-height: 160px; min-height: 42px;
      }
      textarea:focus { outline: none; border-color: var(--accent); }

      /* ---- Detail ---- */
      .detail { padding: 16px; }
      .detail .empty { margin-top: 60px; }
      .detail h2 { font-size: 15px; margin: 0 0 6px; line-height: 1.3; }
      .strip { display: flex; gap: 4px; margin: 14px 0 4px; }
      .stage { flex: 1; text-align: center; font-size: 9.5px; text-transform: uppercase; letter-spacing: 0.03em;
        padding: 6px 2px; border-radius: 7px; border: 1px solid var(--border); color: var(--faint); position: relative; }
      .stage.done { color: var(--green); border-color: var(--green-line); }
      .stage.skipped { color: var(--faint); border-style: dashed; }
      .stage.active { color: var(--accent); border-color: var(--accent); background: var(--accent-dim); }
      .lbl { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--faint); margin: 16px 0 5px; font-weight: 650; }
      .evi { background: var(--surface); border: 1px solid var(--border); border-radius: 9px; padding: 9px 11px; font-size: 12px; }
      .evi.verified { border-color: var(--green-line); }
      .evi.unverified { border-color: var(--border-strong); color: var(--muted); }
      .evi .vtag { font-weight: 650; }
      .spec { font-size: 12.5px; color: var(--muted); white-space: pre-wrap; }
      .actions { display: flex; gap: 8px; margin: 16px 0 4px; flex-wrap: wrap; }
      .rc-box { margin: 10px 0; display: none; }
      .rc-box.open { display: block; }
      .filediff { background: var(--surface); border: 1px solid var(--border); border-radius: 9px; margin: 6px 0; overflow: hidden; }
      .filediff summary { padding: 7px 11px; font-size: 11.5px; font-family: ui-monospace, monospace; cursor: pointer; color: var(--text); background: var(--surface-2); }
      .filediff pre { margin: 0; padding: 8px 11px; font-size: 11px; font-family: ui-monospace, monospace; overflow-x: auto; white-space: pre; line-height: 1.45; }
      .dl-add { color: var(--green); } .dl-del { color: #b58986; } .dl-hunk { color: var(--faint); }
      .transcript { font-size: 11px; font-family: ui-monospace, monospace; color: var(--muted); background: var(--surface); border: 1px solid var(--border); border-radius: 9px; padding: 9px 11px; white-space: pre-wrap; max-height: 180px; overflow-y: auto; }
      .blocked-note { background: var(--surface-2); border: 1px solid var(--border-strong); border-left: 2px solid var(--border-strong); color: var(--muted); border-radius: 9px; padding: 9px 11px; font-size: 12px; white-space: pre-wrap; }
      .cap { font-size: 11px; color: var(--faint); margin-top: 6px; }
      .cap.over { color: var(--amber); }
      .pr { font-size: 11.5px; color: var(--muted); font-family: ui-monospace, monospace; word-break: break-all; }

      /* toasts */
      #toasts { position: fixed; top: 14px; right: 14px; z-index: 1100; display: flex; flex-direction: column; gap: 8px; max-width: 320px; }
      .toast { background: var(--raised); border: 1px solid var(--border-strong); border-left-width: 3px; border-radius: 9px;
        padding: 10px 12px; font-size: 12.5px; box-shadow: 0 4px 16px rgba(0,0,0,0.5); cursor: pointer;
        animation: toastIn 0.18s ease; display: flex; gap: 8px; align-items: flex-start; }
      .toast.review { border-left-color: var(--green); }
      .toast.blocked { border-left-color: var(--border-strong); }
      .toast.merged { border-left-color: var(--muted); }
      .toast .tt { font-weight: 600; }
      .toast .ts { color: var(--muted); font-size: 11.5px; }
      @keyframes toastIn { from { opacity: 0; transform: translateX(12px); } to { opacity: 1; transform: none; } }

      /* help overlay */
      #help { position: fixed; inset: 0; z-index: 1200; background: rgba(0,0,0,0.55); display: flex; align-items: center; justify-content: center; padding: 20px; }
      .help-card { background: var(--surface); border: 1px solid var(--border-strong); border-radius: 14px; padding: 22px 24px; max-width: 460px; width: 100%; box-shadow: 0 12px 48px rgba(0,0,0,0.6); }
      .help-card h3 { margin: 0 0 4px; font-size: 16px; }
      .help-card p { margin: 0 0 14px; color: var(--muted); font-size: 12.5px; }
      .help-card h4 { margin: 16px 0 8px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--faint); }
      .help-grid { display: flex; flex-direction: column; gap: 7px; font-size: 12.5px; }
      .help-grid b { color: var(--accent); font-weight: 650; }
      .help-keys { display: flex; flex-wrap: wrap; gap: 7px 14px; font-size: 12px; color: var(--muted); }
      .help-keys b { color: var(--text); background: var(--surface-2); border: 1px solid var(--border); border-radius: 4px; padding: 0 5px; font-weight: 600; }

      /* ============ Codex-style refinements ============ */
      .ic-svg { width: 15px; height: 15px; flex: 0 0 auto; vertical-align: -2px; }
      .col-head { font-weight: 600; }              /* quieter chrome */
      .activity .ic-svg { margin-right: 4px; }

      /* roomier chat column, lighter card hover */
      .chat-log { padding: 22px 24px; gap: 18px; }
      .card { transition: background 0.12s ease, border-color 0.12s ease; }
      .card:hover { border-color: var(--border); background: var(--surface-2); }

      /* assistant messages flow on the canvas (no bubble); user keeps a subtle one */
      .msg { max-width: 100%; }
      .msg.user { align-self: flex-end; max-width: 84%; }
      .msg.assistant { align-self: stretch; }

      /* markdown prose */
      .md { line-height: 1.62; font-size: 13.5px; }
      .md > :first-child { margin-top: 0; }
      .md > :last-child { margin-bottom: 0; }
      .md p { margin: 0 0 10px; }
      .md h1, .md h2, .md h3 { margin: 16px 0 8px; line-height: 1.3; font-weight: 650; }
      .md h1 { font-size: 17px; } .md h2 { font-size: 15px; } .md h3 { font-size: 13.5px; }
      .md ul, .md ol { margin: 0 0 10px; padding-left: 20px; }
      .md li { margin: 3px 0; }
      .md li::marker { color: var(--faint); }
      .md strong { font-weight: 650; color: var(--text); }
      .md em { font-style: italic; }
      .md a { color: var(--accent); }
      .md code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.86em; background: var(--surface-2); border: 1px solid var(--border); border-radius: 5px; padding: 0.5px 5px; }
      .md blockquote { margin: 0 0 10px; padding: 1px 0 1px 12px; border-left: 2px solid var(--border-strong); color: var(--muted); }
      .md hr { border: none; border-top: 1px solid var(--border); margin: 14px 0; }
      .md table { border-collapse: collapse; margin: 0 0 10px; font-size: 12.5px; display: block; max-width: 100%; overflow-x: auto; }
      .md th, .md td { border: 1px solid var(--border); padding: 5px 10px; text-align: left; }
      .md th { background: var(--surface-2); font-weight: 600; }

      /* fenced code blocks → titled cards (Codex-style) */
      .codeblock { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; margin: 0 0 10px; overflow: hidden; }
      .cb-head { display: flex; align-items: center; gap: 8px; padding: 6px 8px 6px 12px; background: var(--surface-2); border-bottom: 1px solid var(--border); font-size: 11px; color: var(--muted); font-family: ui-monospace, monospace; }
      .cb-copy { margin-left: auto; background: transparent; color: var(--faint); border: none; border-radius: 6px; padding: 3px 7px; font-size: 11px; font-weight: 500; }
      .cb-copy:hover { background: var(--surface); color: var(--text); filter: none; }
      .cb-copy .ic-svg { width: 13px; height: 13px; }
      .codeblock pre { margin: 0; padding: 10px 12px; overflow-x: auto; font-family: ui-monospace, monospace; font-size: 12px; line-height: 1.5; white-space: pre; }

      /* collapsible "Worked" activity fold */
      .acts-fold { margin: 0 0 2px; }
      .acts-fold > summary { list-style: none; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--muted); padding: 3px 0; user-select: none; }
      .acts-fold > summary::-webkit-details-marker { display: none; }
      .acts-fold > summary:hover { color: var(--text); }
      .acts-fold > summary .ic-svg { color: var(--faint); width: 13px; height: 13px; }
      .acts-fold[open] > summary { margin-bottom: 5px; }
      .act .ic-svg { color: var(--faint); }

      /* composer: one rounded container with an inline toolbar */
      .composer { border-top: 1px solid var(--border); padding: 12px 16px 16px; background: var(--bg); }
      .composer-box { background: var(--surface); border: 1px solid var(--border-strong); border-radius: 14px; padding: 7px 9px 9px; transition: border-color 0.12s ease; }
      .composer-box:focus-within { border-color: var(--accent); }
      .composer-box textarea { width: 100%; resize: none; background: transparent; color: var(--text); border: none; border-radius: 0; padding: 6px 7px 2px; font: inherit; font-size: 13.5px; line-height: 1.5; max-height: 200px; min-height: 26px; display: block; }
      .composer-box textarea:focus { outline: none; border: none; }
      .composer-bar { display: flex; align-items: center; gap: 8px; padding: 4px 2px 0; }
      .composer-hint { font-size: 11px; color: var(--faint); }
      .send-btn { margin-left: auto; width: 30px; height: 30px; padding: 0; border-radius: 8px; }
      .send-btn .ic-svg { width: 16px; height: 16px; }
      .send-btn:disabled { opacity: 0.4; }

      /* folder picker overlay */
      #fp { position: fixed; inset: 0; z-index: 1200; background: rgba(0,0,0,0.55); display: flex; align-items: center; justify-content: center; padding: 20px; }
      .fp-card { background: var(--surface); border: 1px solid var(--border-strong); border-radius: 14px; padding: 20px 22px; max-width: 540px; width: 100%; box-shadow: 0 12px 48px rgba(0,0,0,0.6); display: flex; flex-direction: column; max-height: 80vh; }
      .fp-card h3 { margin: 0 0 4px; font-size: 16px; }
      .fp-card p { margin: 0 0 12px; color: var(--muted); font-size: 12.5px; }
      .fp-path { display: flex; gap: 8px; margin-bottom: 10px; }
      .fp-path input { flex: 1; background: var(--bg); color: var(--text); border: 1px solid var(--border-strong); border-radius: 9px; padding: 8px 11px; font: inherit; font-family: ui-monospace, monospace; font-size: 12px; }
      .fp-path input:focus { outline: none; border-color: var(--accent); }
      .fp-list { flex: 1; overflow-y: auto; border: 1px solid var(--border); border-radius: 10px; background: var(--bg); min-height: 180px; }
      .fp-row { display: flex; align-items: center; gap: 9px; padding: 7px 12px; cursor: pointer; font-size: 12.5px; border-bottom: 1px solid var(--border); }
      .fp-row:last-child { border-bottom: none; }
      .fp-row:hover { background: var(--surface-2); }
      .fp-row .ic { width: 16px; text-align: center; flex: 0 0 16px; }
      .fp-row .repo-tag { margin-left: auto; font-size: 10px; color: var(--green); border: 1px solid var(--green-line); border-radius: 20px; padding: 1px 7px; font-weight: 600; }
      .fp-row.up { color: var(--muted); }
      .fp-empty { padding: 18px 12px; color: var(--faint); font-size: 12px; text-align: center; }
      .fp-foot { display: flex; align-items: center; gap: 10px; margin-top: 12px; }
      .fp-cur { flex: 1; min-width: 0; font-size: 11.5px; color: var(--muted); font-family: ui-monospace, monospace; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .fp-err { color: var(--amber); font-size: 12px; margin-top: 8px; min-height: 16px; }
    </style>
  </head>
  <body>
    <div id="tabs">
      <button data-pane="board" class="active" onclick="setPane('board')">Tasks</button>
      <button data-pane="main" onclick="goChat()">Chat</button>
      <button data-pane="detail" onclick="setPane('detail')">Detail</button>
    </div>
    <div id="toasts"></div>
    <div id="app">
      <!-- LEFT: board -->
      <div class="col" id="col-board">
        <div class="col-head brand">
          <div class="proj"><span class="name" id="projName">Freebuff</span><span class="branch" id="projBranch"></span></div>
          <button class="ghost sm" style="margin-left:auto" onclick="openFolderPicker()" title="Open a project folder"><svg class="ic-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2z"/></svg> Open</button>
          <button class="ghost sm" onclick="openPreview()" title="Preview index.html"><svg class="ic-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg> Preview</button>
          <button class="ghost sm" onclick="openRun()" title="Run a command in the project"><svg class="ic-svg" viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M7 4v16l13-8z"/></svg> Run</button>
        </div>
        <div class="col-body">
          <div id="cta"></div>
          <div id="columns"></div>
          <div class="section-h">Governing Docs</div>
          <div id="docs"></div>
          <div class="kbd-hint"><b>j/k</b> move · <b>a</b> approve · <b>r</b> changes · <b>p</b> preview · <b>c</b> chat</div>
        </div>
      </div>

      <!-- CENTER: chat or doc editor -->
      <div class="col active" id="col-main">
        <div class="col-head" id="mainHead"><span id="mainTitle">Orchestrator</span><span class="activity" id="activity"></span><button class="ghost sm" style="margin-left:10px" onclick="toggleHelp()" title="Help (?)">?</button></div>
        <div class="col-body" id="mainBody"><!-- chat or doc --></div>
      </div>

      <!-- RIGHT: task detail -->
      <div class="col" id="col-detail">
        <div class="col-head">Task Detail</div>
        <div class="col-body"><div id="detail"><div class="detail"><div class="empty">Select a task to see its pipeline, diff, and review actions.</div></div></div></div>
      </div>
    </div>

    <script>
      const STAGES = ['implement', 'simplify', 'review', 'test', 'pr']
      const COLS = [
        ['proposed', 'Proposed'], ['ready', 'Ready'], ['running', 'Running'],
        ['awaiting-approval', 'Needs review'], ['blocked', 'Blocked'], ['merged', 'Merged'],
        ['archived', 'Archived'],
      ]
      const EXAMPLES = [
        'Build a Breakout game in index.html with vanilla JS and canvas.',
        'Add a dark-mode toggle that persists to localStorage.',
        'Set up a landing page with a hero, features, and footer.',
      ]
      const state = { snap: null, sel: null, chat: [], transcripts: {}, artifacts: {}, view: 'chat', doc: null, pane: 'main', rcOpen: false, pendingAbandon: null }

      // ---- Thin line icons (lucide-style), so the UI reads designed, not emoji-y ----
      const ICON = {
        plus: '<path d="M5 12h14M12 5v14"/>',
        pencil: '<path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/>',
        link: '<path d="M9 17H7A5 5 0 0 1 7 7h2"/><path d="M15 7h2a5 5 0 0 1 0 10h-2"/><path d="M8 12h8"/>',
        x: '<path d="M18 6 6 18M6 6l12 12"/>',
        trash: '<path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/>',
        message: '<path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8z"/>',
        dot: '<circle cx="12" cy="12" r="3.5" fill="currentColor" stroke="none"/>',
        check: '<path d="M20 6 9 17l-5-5"/>',
        lightbulb: '<path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5a6 6 0 0 0-12 0c0 1.3.5 2.6 1.5 3.5.8.8 1.3 1.5 1.5 2.5"/><path d="M9 18h6"/><path d="M10 22h4"/>',
        play: '<path d="M7 4v16l13-8z" fill="currentColor" stroke="currentColor"/>',
        eye: '<path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/>',
        arrowUp: '<path d="M12 19V5"/><path d="M5 12l7-7 7 7"/>',
        arrowLeft: '<path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/>',
        refresh: '<path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v5h-5"/>',
        maximize: '<path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/>',
        external: '<path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>',
        copy: '<rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>',
        activity: '<path d="M22 12h-4l-3 9L9 3l-3 9H2"/>',
      }
      function icon(name, extra) {
        const p = ICON[name]; if (!p) return ''
        return '<svg class="ic-svg' + (extra ? ' ' + extra : '') + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + p + '</svg>'
      }

      // ---- Minimal, safe markdown → HTML for assistant messages (Codex-style prose) ----
      // Input is escaped up front, so every branch below works on already-safe text.
      function mdInline(s) {
        const codes = []
        s = s.replace(/`([^`]+)`/g, (m, c) => { codes.push(c); return '␀' + (codes.length - 1) + '␀' })
        s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
             .replace(/\*([^*\n]+)\*/g, '<em>$1</em>')
             .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
        return s.replace(/␀(\d+)␀/g, (m, i) => '<code>' + codes[+i] + '</code>')
      }
      let cbSeq = 0
      function codeCard(b) {
        const id = 'cb' + (++cbSeq)
        return '<div class="codeblock"><div class="cb-head"><span>' + esc(b.lang || 'code') + '</span>' +
          '<button class="cb-copy" onclick="copyCode(this,\'' + id + '\')">' + icon('copy') + 'Copy</button></div>' +
          '<pre data-cb="' + id + '">' + b.body + '</pre></div>'
      }
      function copyCode(btn, id) {
        const pre = document.querySelector('pre[data-cb="' + id + '"]'); if (!pre) return
        navigator.clipboard.writeText(pre.textContent).then(() => {
          const o = btn.innerHTML; btn.innerHTML = icon('check') + 'Copied'
          setTimeout(() => { btn.innerHTML = o }, 1200)
        }).catch(() => {})
      }
      function mdToHtml(src) {
        let s = esc(src == null ? '' : String(src))
        const code = []
        s = s.replace(/```([^\n`]*)\n?([\s\S]*?)```/g, (m, lang, body) => {
          code.push({ lang: (lang || '').trim(), body: body.replace(/\n$/, '') })
          return 'CB' + (code.length - 1) + ''
        })
        const lines = s.split('\n')
        const out = []
        let para = [], list = null
        const flushPara = () => { if (para.length) { out.push('<p>' + mdInline(para.join(' ')) + '</p>'); para = [] } }
        const flushList = () => { if (list) { out.push('<' + list.type + '>' + list.items.map((it) => '<li>' + mdInline(it) + '</li>').join('') + '</' + list.type + '>'); list = null } }
        const flushAll = () => { flushPara(); flushList() }
        for (let i = 0; i < lines.length; i++) {
          const ln = lines[i]; let m
          if (m = ln.match(/^CB(\d+)$/)) { flushAll(); out.push(codeCard(code[+m[1]])); continue }
          if (/^\s*$/.test(ln)) { flushAll(); continue }
          if (m = ln.match(/^(#{1,3})\s+(.*)$/)) { flushAll(); const l = m[1].length; out.push('<h' + l + '>' + mdInline(m[2]) + '</h' + l + '>'); continue }
          if (/^\s*([-*_])(\s*\1){2,}\s*$/.test(ln)) { flushAll(); out.push('<hr>'); continue }
          if (m = ln.match(/^>\s?(.*)$/)) {
            flushAll(); const bq = [m[1]]
            while (i + 1 < lines.length && (m = lines[i + 1].match(/^>\s?(.*)$/))) { bq.push(m[1]); i++ }
            out.push('<blockquote>' + mdInline(bq.join(' ')) + '</blockquote>'); continue
          }
          // table: a header row with pipes followed by a |---|---| separator
          if (ln.indexOf('|') !== -1 && i + 1 < lines.length && /-/.test(lines[i + 1]) && /^\s*\|?[\s:|-]+\|?\s*$/.test(lines[i + 1])) {
            flushAll()
            const row = (r) => r.replace(/^\s*\|/, '').replace(/\|\s*$/, '').split('|').map((c) => c.trim())
            const head = row(ln); i++
            const rows = []
            while (i + 1 < lines.length && lines[i + 1].indexOf('|') !== -1 && !/^\s*$/.test(lines[i + 1])) { rows.push(row(lines[i + 1])); i++ }
            out.push('<table><thead><tr>' + head.map((h) => '<th>' + mdInline(h) + '</th>').join('') + '</tr></thead><tbody>' +
              rows.map((r) => '<tr>' + r.map((c) => '<td>' + mdInline(c) + '</td>').join('') + '</tr>').join('') + '</tbody></table>')
            continue
          }
          if (m = ln.match(/^\s*[-*+]\s+(.*)$/)) { flushPara(); if (!list || list.type !== 'ul') { flushList(); list = { type: 'ul', items: [] } } list.items.push(m[1]); continue }
          if (m = ln.match(/^\s*\d+[.)]\s+(.*)$/)) { flushPara(); if (!list || list.type !== 'ol') { flushList(); list = { type: 'ol', items: [] } } list.items.push(m[1]); continue }
          flushList(); para.push(ln.trim())
        }
        flushAll()
        return out.join('')
      }

      // ---- SSE ----
      const es = new EventSource('/api/events')
      es.onmessage = (e) => {
        const ev = JSON.parse(e.data)
        if (ev.type === 'state') { state.snap = ev.snapshot; processToasts(); renderAll() }
        else if (ev.type === 'chat') onChat(ev.event)
        else if (ev.type === 'agent') onAgent(ev)
      }

      function tasks() { return state.snap ? state.snap.tasks : [] }
      function task(id) { return tasks().find((t) => t.id === id) }
      function isMerged(id) { const t = task(id); return t && t.status === 'merged' }
      function unmergedParents(t) { return (t.parents || []).filter((p) => !isMerged(p)) }
      // A 'ready' task whose parents aren't all merged is really waiting, not runnable.
      function effectiveStatus(t) {
        if (t.status === 'ready' && unmergedParents(t).length) return 'waiting'
        return t.status
      }

      // ---- Chat events ----
      function freshAssistant() {
        let last = state.chat[state.chat.length - 1]
        if (!last || last.role !== 'assistant' || last.done) { last = { role: 'assistant', text: '', acts: [] }; state.chat.push(last) }
        return last
      }
      function friendlyTool(name, input) {
        try {
          if (name === 'create_task') return { ic: 'plus', text: 'New task: ' + (input.title || '…') }
          if (name === 'update_task') return { ic: 'pencil', text: 'Updated task ' + input.taskId }
          if (name === 'add_dependency') return { ic: 'link', text: input.to + ' depends on ' + input.from }
          if (name === 'remove_dependency') return { ic: 'x', text: 'Removed ' + input.from + ' → ' + input.to }
          if (name === 'abandon_task') return { ic: 'trash', text: 'Abandoned ' + input.taskId }
          if (name === 'send_guidance') return { ic: 'message', text: 'Steered ' + input.taskId }
          return { ic: 'dot', text: name.replace(/_/g, ' '), subtle: true }
        } catch { return { ic: 'dot', text: name, subtle: true } }
      }
      function onChat(event) {
        if (event.type === 'text') { freshAssistant().text += event.text }
        else if (event.type === 'tool_call') { freshAssistant().acts.push({ toolName: event.toolName, input: event.input }) }
        else if (event.type === 'finish') { const l = state.chat[state.chat.length - 1]; if (l && l.role === 'assistant') l.done = true }
        if (state.view === 'chat') renderMain()
      }
      function onAgent(ev) {
        const t = (state.transcripts[ev.taskId] = state.transcripts[ev.taskId] || [])
        if (ev.event.type === 'tool_call') t.push('▸ ' + ev.stage + ': ' + ev.event.toolName)
        else if (ev.event.type === 'finish') t.push('✓ ' + ev.stage)
        if (t.length > 80) t.splice(0, t.length - 80)
        if (state.sel === ev.taskId) renderDetail()
      }

      // ---- Render ----
      function renderAll() { renderHeader(); renderBoard(); if (state.view !== 'doc') renderMain(); renderDetail() }

      // Tick the running-stage elapsed badges every second in place — keeps a slow
      // stage visibly counting up between SSE state events, without a full re-render
      // (which would steal focus from an open request-changes textarea).
      setInterval(() => {
        document.querySelectorAll('.elapsed[data-since]').forEach((el) => {
          el.textContent = fmtElapsed(Date.now() - Number(el.getAttribute('data-since')))
        })
      }, 1000)

      function renderHeader() {
        const s = state.snap; if (!s) return
        const repo = s.project.repoUrl || s.project.rootPath || ''
        document.getElementById('projName').textContent = repo.split('/').filter(Boolean).pop() || 'project'
        document.getElementById('projBranch').textContent = '⎇ ' + s.project.defaultBranch
        const running = s.usage.running, cap = s.usage.cap
        const merged = tasks().filter((t) => t.status === 'merged').length
        document.getElementById('activity').innerHTML =
          '<span>' + (running > 0 ? '<span class="pulse"></span>' : icon('play')) + '<b>' + running + '</b>/' + cap + ' running</span><span>' + icon('check') + '<b>' + merged + '</b> merged</span>'
      }

      function renderBoard() {
        const ts = tasks()
        const reviewCount = ts.filter((t) => t.status === 'awaiting-approval').length
        const proposedCount = ts.filter((t) => t.status === 'proposed').length
        document.getElementById('cta').innerHTML =
          (reviewCount ? '<div class="cta" onclick="selectFirstReview()">' + icon('check') + reviewCount + ' task' + (reviewCount > 1 ? 's' : '') + ' ready for your review</div>' : '') +
          (proposedCount ? '<div class="cta scout-cta" onclick="selectFirst(\'proposed\')">' + icon('lightbulb') + proposedCount + ' suggestion' + (proposedCount > 1 ? 's' : '') + ' from Scout</div>' : '')
        const group = (s) => ts.filter((t) =>
          s === 'blocked' ? ['blocked', 'failed'].includes(t.status)
          : s === 'archived' ? t.status === 'abandoned'
          : s === 'ready' ? t.status === 'ready'
          : t.status === s)
        document.getElementById('columns').innerHTML = COLS.map(([s, label]) => {
          const items = group(s)
          if (!items.length && ['merged', 'blocked', 'proposed', 'archived'].includes(s)) return ''
          return '<div class="section-h">' + label + ' · ' + items.length + '</div>' + items.map(cardHtml).join('')
        }).join('')
        renderDocs()
        renderTabBadges(reviewCount)
      }

      // Compact elapsed like "5s", "2m", "1h03m" — so a slow stage reads as progress.
      function fmtElapsed(ms) {
        const s = Math.max(0, Math.floor(ms / 1000))
        if (s < 60) return s + 's'
        const m = Math.floor(s / 60)
        if (m < 60) return m + 'm'
        return Math.floor(m / 60) + 'h' + String(m % 60).padStart(2, '0') + 'm'
      }
      // Status pill for a task; `withStage` appends "· <stage> <elapsed>" (board cards only).
      // The elapsed span carries data-since so a 1s ticker can update it without a
      // full re-render (which would steal focus from the request-changes textarea).
      function statusBadgeHtml(t, withStage) {
        const eff = effectiveStatus(t)
        if (eff === 'waiting') return '<span class="badge dot b-waiting">waiting on ' + unmergedParents(t).join(', ') + '</span>'
        const cls = eff === 'awaiting-approval' ? 'review' : eff
        const label = eff === 'awaiting-approval' ? 'needs review' : eff
        let suffix = ''
        if (withStage && t.stage) {
          suffix = ' · ' + t.stage
          if (eff === 'running' && t.updatedAt) {
            suffix += ' <span class="elapsed" data-since="' + t.updatedAt + '">' + fmtElapsed(Date.now() - t.updatedAt) + '</span>'
          }
        }
        return '<span class="badge dot b-' + cls + '">' + label + suffix + '</span>'
      }
      function cardHtml(t) {
        const eff = effectiveStatus(t)
        const scout = t.origin === 'scout' ? '<span class="badge scout">scout</span>' : ''
        return '<div class="card ' + (state.sel === t.id ? 'sel' : '') + (eff === 'waiting' ? ' waiting' : '') + '" onclick="selectTask(\'' + t.id + '\')">' +
          '<div class="ti">' + esc(t.title) + '</div><div class="row">' + statusBadgeHtml(t, true) + scout + '</div></div>'
      }

      function renderDocs() {
        const docs = state.snap ? state.snap.docs : []
        document.getElementById('docs').innerHTML = docs.map((d) =>
          '<div class="docs-item ' + (d.present ? 'present' : '') + (state.view === 'doc' && state.doc === d.name ? ' sel' : '') + '" onclick="openDoc(\'' + d.name + '\')"><span class="pdot"></span>' + d.name + '.md</div>'
        ).join('')
      }

      function renderTabBadges(reviewCount) {
        const mainBtn = document.querySelector('#tabs [data-pane="detail"]')
        if (mainBtn) mainBtn.innerHTML = 'Detail' + (reviewCount ? '<span class="tab-badge">' + reviewCount + '</span>' : '')
      }

      // ---- Main pane: chat or doc ----
      function renderMain() {
        document.getElementById('mainTitle').textContent = state.view === 'doc' ? state.doc + '.md' : (state.view === 'run' ? 'Run' : 'Orchestrator')
        const body = document.getElementById('mainBody')
        if (state.view === 'doc') { renderDocEditor(body); return }
        if (state.view === 'run') { renderRunPanel(body); return }
        if (state.view === 'preview') { renderPreviewPanel(body); return }
        body.innerHTML =
          '<div class="chat"><div class="chat-log" id="chatLog"></div>' +
          '<div class="composer"><div class="composer-box"><textarea id="chatInput" placeholder="Describe what to build, or steer a task…" rows="1"></textarea>' +
          '<div class="composer-bar"><span class="composer-hint">↵ send · ⇧↵ newline</span>' +
          '<button id="sendBtn" class="send-btn" title="Send">' + icon('arrowUp') + '</button></div></div></div></div>'
        const ta = document.getElementById('chatInput')
        ta.addEventListener('input', () => { ta.style.height = 'auto'; ta.style.height = Math.min(ta.scrollHeight, 160) + 'px' })
        ta.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send() } })
        document.getElementById('sendBtn').onclick = send
        renderChatLog()
      }

      function renderChatLog() {
        const log = document.getElementById('chatLog'); if (!log) return
        if (!state.chat.length) {
          log.innerHTML = '<div class="empty"><h2>What should we build?</h2><p>Describe a feature or a whole project — the orchestrator breaks it into tasks and drives them to review-ready PRs.</p><div class="examples">' +
            EXAMPLES.map((x) => '<button class="ex" onclick="useExample(this)">' + esc(x) + '</button>').join('') + '</div></div>'
          return
        }
        log.innerHTML = state.chat.map((m) => {
          if (m.role === 'user') return '<div class="msg user"><div class="bubble">' + esc(m.text) + '</div></div>'
          const n = (m.acts || []).length
          const items = n ? m.acts.map((a) => { const f = friendlyTool(a.toolName, a.input); return '<div class="act ' + (f.subtle ? 'subtle' : '') + '">' + icon(f.ic) + esc(f.text) + '</div>' }).join('') : ''
          // Collapse the tool activity behind a "Worked · N steps" fold (open while streaming).
          const acts = n ? '<details class="acts-fold"' + (m.done ? '' : ' open') + '><summary>' + icon('activity') + 'Worked · ' + n + (n > 1 ? ' steps' : ' step') + '</summary><div class="acts">' + items + '</div></details>' : ''
          const txt = m.text ? '<div class="md">' + mdToHtml(m.text) + '</div>' : (!m.done && !acts ? '<div class="thinking">Thinking…</div>' : '')
          return '<div class="msg assistant">' + acts + txt + '</div>'
        }).join('')
        log.scrollTop = log.scrollHeight
      }

      function useExample(el) { const ta = document.getElementById('chatInput'); ta.value = el.textContent; ta.focus() }
      async function send() {
        const ta = document.getElementById('chatInput'); const message = ta.value.trim(); if (!message) return
        ta.value = ''; ta.style.height = 'auto'
        state.chat.push({ role: 'user', text: message, done: true }); renderChatLog()
        await fetch('/api/chat', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ message }) })
      }

      // ---- Doc viewer/editor ----
      async function openDoc(name) {
        state.view = 'doc'; state.doc = name
        setPane('main'); renderDocs(); renderMain()
        const r = await fetch('/api/doc/' + name).then((x) => x.json())
        state.docData = r; renderMain()
      }
      function backToChat() { state.view = 'chat'; state.docData = null; renderDocs(); renderMain() }
      function goChat() { backToChat(); setPane('main') }

      // ---- Help overlay ----
      function toggleHelp() {
        let el = document.getElementById('help')
        if (el) { el.remove(); return }
        el = document.createElement('div'); el.id = 'help'
        el.onclick = (e) => { if (e.target.id === 'help') el.remove() }
        el.innerHTML =
          '<div class="help-card"><h3>◆ Freebuff Desktop</h3>' +
          '<p>Chat with the orchestrator to break work into tasks; each runs a quality-gate pipeline and arrives as a review-ready PR.</p>' +
          '<div class="help-grid">' +
          '<div><b>Build</b> — describe a feature or whole project in the chat</div>' +
          '<div><b>Review</b> — open a task, read its diff &amp; evidence, then Approve &amp; Merge</div>' +
          '<div><b>Preview</b> — see web projects live (⤢ for fullscreen); auto-refreshes on merge</div>' +
          '<div><b>Run</b> — run a command (CLI, tests, build) in the project</div>' +
          '<div><b>Docs</b> — edit the governing docs that steer every agent</div>' +
          '</div><h4>Keyboard</h4><div class="help-keys">' +
          '<span><b>j</b>/<b>k</b> move tasks</span><span><b>a</b> approve</span><span><b>r</b> request changes</span>' +
          '<span><b>p</b> preview</span><span><b>c</b> chat</span><span><b>?</b> help</span><span><b>Esc</b> close</span>' +
          '</div></div>'
        document.body.appendChild(el)
      }

      // ---- Folder picker: open a local git repo as the project ----
      async function openFolderPicker() {
        if (document.getElementById('fp')) return
        const el = document.createElement('div'); el.id = 'fp'
        el.onclick = (e) => { if (e.target.id === 'fp') el.remove() }
        el.innerHTML =
          '<div class="fp-card"><h3>Open a project folder</h3>' +
          '<p>Pick a local git repository. The orchestrator will run tasks against it.</p>' +
          '<div class="fp-path"><input id="fpInput" placeholder="Type or paste an absolute path…" spellcheck="false" />' +
          '<button class="ghost sm" onclick="fpGoTyped()">Go</button></div>' +
          '<div class="fp-list" id="fpList"></div>' +
          '<div class="fp-err" id="fpErr"></div>' +
          '<div class="fp-foot"><span class="fp-cur" id="fpCur"></span>' +
          '<button class="ghost sm" onclick="document.getElementById(\'fp\').remove()">Cancel</button>' +
          '<button id="fpOpen" onclick="fpConfirm()">Open this folder</button></div></div>'
        document.body.appendChild(el)
        document.getElementById('fpInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') fpGoTyped() })
        await fpBrowse(null)
      }
      async function fpBrowse(path) {
        const qs = path ? '?path=' + encodeURIComponent(path) : ''
        let data
        try { data = await fetch('/api/fs/list' + qs).then((r) => r.json()) } catch { return }
        state.fp = data
        const list = document.getElementById('fpList'); if (!list) return
        const rows = []
        if (data.parent) rows.push('<div class="fp-row up" onclick="fpBrowse(' + jsStr(data.parent) + ')"><span class="ic">↑</span>Parent folder</div>')
        for (const e of data.entries) {
          rows.push('<div class="fp-row" onclick="fpBrowse(' + jsStr(e.path) + ')"><span class="ic">' + (e.isRepo ? '◆' : '📁') + '</span>' +
            esc(e.name) + (e.isRepo ? '<span class="repo-tag">git</span>' : '') + '</div>')
        }
        list.innerHTML = rows.length ? rows.join('') : '<div class="fp-empty">No subfolders here.</div>'
        const input = document.getElementById('fpInput'); if (input) input.value = data.path
        const cur = document.getElementById('fpCur'); if (cur) cur.textContent = data.isRepo ? '✓ git repo — ready to open' : 'Not a git repo'
        const openBtn = document.getElementById('fpOpen'); if (openBtn) openBtn.disabled = !data.isRepo
        const err = document.getElementById('fpErr'); if (err) err.textContent = ''
      }
      function fpGoTyped() { const v = (document.getElementById('fpInput').value || '').trim(); if (v) fpBrowse(v) }
      // Load the persisted chat transcript (on first load and after switching projects).
      function loadChatHistory() {
        return fetch('/api/chat-history').then((r) => r.json()).then((hist) => {
          state.chat = (Array.isArray(hist) ? hist : []).map((m) => ({ role: m.role, text: m.text, acts: m.acts || [], done: true }))
          if (state.view === 'chat') renderChatLog()
        }).catch(() => {})
      }
      async function fpConfirm() {
        const path = state.fp && state.fp.path; if (!path) return
        const btn = document.getElementById('fpOpen'); const err = document.getElementById('fpErr')
        btn.disabled = true; btn.textContent = 'Opening…'
        try {
          const r = await fetch('/api/project/open', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ path }) })
          const data = await r.json()
          if (!r.ok) { err.textContent = data.error || 'Could not open folder'; btn.disabled = false; btn.textContent = 'Open this folder'; return }
          // Reset client view to the new project; SSE pushes the fresh state.
          state.sel = null; state.chat = []; state.transcripts = {}; state.artifacts = {}; state.prevStatuses = null
          document.getElementById('fp').remove()
          loadChatHistory()
          backToChat()
        } catch (e) { err.textContent = 'Could not open folder'; btn.disabled = false; btn.textContent = 'Open this folder' }
      }
      // Single-quote-safe arg for inline onclick handlers (paths may contain quotes/spaces).
      function jsStr(s) { return "'" + String(s).replace(/\\/g, '\\\\').replace(/'/g, "\\'") + "'" }

      // ---- Preview panel (iframe the project's index.html) ----
      function nextNonce() { return (state.previewNonce = (state.previewNonce || 0) + 1) }
      function openPreview() { state.view = 'preview'; setPane('main'); renderMain() }
      function renderPreviewPanel(body) {
        const nonce = nextNonce()
        body.innerHTML =
          '<div style="display:flex;flex-direction:column;height:100%">' +
          '<div style="display:flex;gap:8px;align-items:center;padding:9px 12px;border-bottom:1px solid var(--border)">' +
          '<button class="ghost sm" onclick="backToChat()">' + icon('arrowLeft') + ' Chat</button>' +
          '<button class="ghost sm" onclick="openPreview()">' + icon('refresh') + ' Refresh</button>' +
          '<button class="ghost sm" onclick="toggleFullscreen()">' + icon('maximize') + ' Fullscreen</button>' +
          '<a class="ghost sm" style="padding:5px 10px;border:1px solid var(--border-strong);border-radius:8px;text-decoration:none" href="/preview/index.html" target="_blank">Open ' + icon('external') + '</a>' +
          '<span style="color:var(--muted);font-size:12px;margin-left:auto">Live preview of index.html on main</span></div>' +
          '<iframe src="/preview/index.html?_=' + nonce + '" style="flex:1;border:none;width:100%;background:var(--bg)"></iframe></div>'
      }
      function toggleFullscreen() {
        state.previewFullscreen = !state.previewFullscreen
        let el = document.getElementById('fsPreview')
        if (state.previewFullscreen) {
          if (!el) { el = document.createElement('div'); el.id = 'fsPreview'; document.body.appendChild(el) }
          const nonce = nextNonce()
          el.style.cssText = 'position:fixed;inset:0;z-index:1000;display:flex;flex-direction:column;background:var(--bg)'
          el.innerHTML =
            '<div style="display:flex;gap:8px;align-items:center;padding:9px 12px;border-bottom:1px solid var(--border)">' +
            '<button class="ghost sm" onclick="toggleFullscreen()">' + icon('x') + ' Close</button>' +
            '<button class="ghost sm" onclick="refreshPreview()">' + icon('refresh') + ' Refresh</button>' +
            '<span style="color:var(--muted);font-size:12px;margin-left:auto">Fullscreen preview · main</span></div>' +
            '<iframe src="/preview/index.html?_=' + nonce + '" style="flex:1;border:none;width:100%;background:var(--bg)"></iframe>'
        } else if (el) { el.remove() }
      }

      // ---- Run panel ----
      function openRun() { state.view = 'run'; setPane('main'); renderMain() }
      function renderRunPanel(body) {
        const rc = state.snap ? state.snap.project.runConfig : {}
        const suggestions = [rc.test, rc.devServer, rc.build].filter(Boolean)
        const cmd = state.lastRunCmd || ''
        body.innerHTML =
          '<div style="padding:16px;display:flex;flex-direction:column;height:100%;gap:10px">' +
          '<div style="display:flex;gap:8px;align-items:center"><button class="ghost sm" onclick="backToChat()">' + icon('arrowLeft') + ' Chat</button>' +
          '<span style="color:var(--muted);font-size:12px">Runs in the project root. Best for CLIs, tests, builds.</span></div>' +
          '<div style="display:flex;gap:8px"><input id="runCmd" placeholder="e.g. node index.js list · npm test · python3 -m http.server 8000" value="' + esc(cmd) + '" style="flex:1;background:var(--bg);color:var(--text);border:1px solid var(--border-strong);border-radius:9px;padding:9px 11px;font:inherit;font-family:ui-monospace,monospace;font-size:12.5px" />' +
          '<button id="runBtn" onclick="runCmd()">Run</button></div>' +
          (suggestions.length ? '<div style="display:flex;gap:6px;flex-wrap:wrap">' + suggestions.map((s) => '<button class="ghost sm" onclick="document.getElementById(\'runCmd\').value=this.textContent" style="font-family:ui-monospace,monospace">' + esc(s) + '</button>').join('') + '</div>' : '') +
          '<div id="runOut" style="flex:1;overflow:auto;background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:11px;font-family:ui-monospace,monospace;font-size:11.5px;white-space:pre-wrap;color:var(--muted)">' + (state.lastRunOut || 'Output appears here.') + '</div>' +
          '</div>'
        const input = document.getElementById('runCmd')
        input.addEventListener('keydown', (e) => { if (e.key === 'Enter') runCmd() })
        input.focus()
      }
      async function runCmd() {
        const command = (document.getElementById('runCmd').value || '').trim(); if (!command) return
        state.lastRunCmd = command
        const out = document.getElementById('runOut'); out.textContent = '$ ' + command + '\n\nRunning…'
        document.getElementById('runBtn').disabled = true
        try {
          const r = await fetch('/api/run', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ command }) }).then((x) => x.json())
          const head = '$ ' + command + (r.timedOut ? '  (timed out)' : '  (exit ' + r.exitCode + ')') + '\n\n'
          const txt = head + ansiStrip((r.stdout || '') + (r.stderr ? '\n' + r.stderr : '')).trim()
          state.lastRunOut = esc(txt); out.innerHTML = state.lastRunOut
        } catch (e) { out.textContent = 'Failed to run: ' + e }
        const b = document.getElementById('runBtn'); if (b) b.disabled = false
      }
      function ansiStrip(s) { return String(s).replace(/\x1b\[[0-9;]*m/g, '') }
      function renderDocEditor(body) {
        const d = state.docData
        body.innerHTML =
          '<div style="padding:16px;display:flex;flex-direction:column;height:100%">' +
          '<div style="display:flex;gap:8px;align-items:center;margin-bottom:10px"><button class="ghost sm" onclick="backToChat()">' + icon('arrowLeft') + ' Chat</button>' +
          '<span style="color:var(--muted);font-size:12px">Edits save directly to this project.</span></div>' +
          '<textarea id="docEdit" style="flex:1;max-height:none;font-family:ui-monospace,monospace;font-size:12.5px" placeholder="(empty — write the guidance that steers every agent here)">' + (d ? esc(d.content) : 'Loading…') + '</textarea>' +
          '<div style="display:flex;align-items:center;gap:10px;margin-top:10px"><button id="docSave" onclick="saveDoc()">Save</button><span class="cap" id="docCap"></span></div></div>'
        const ta = document.getElementById('docEdit')
        if (ta && d) { ta.oninput = updateCap; updateCap() }
      }
      function updateCap() {
        const ta = document.getElementById('docEdit'); const cap = state.docData && state.docData.cap
        if (!ta || !cap) return
        const lines = ta.value ? ta.value.split('\n').length : 0
        const over = lines > cap.lines
        const el = document.getElementById('docCap'); el.textContent = lines + ' / ' + cap.lines + ' lines'
        el.className = 'cap' + (over ? ' over' : ''); document.getElementById('docSave').disabled = over
      }
      async function saveDoc() {
        const content = document.getElementById('docEdit').value
        const r = await fetch('/api/doc/' + state.doc, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ content }) })
        if (!r.ok) { const e = await r.json(); alert(e.error || 'Could not save'); return }
        const btn = document.getElementById('docSave'); btn.textContent = 'Saved ✓'; setTimeout(() => (btn.textContent = 'Save'), 1200)
      }

      // ---- Detail ----
      async function selectTask(id) {
        state.sel = id; state.rcOpen = false
        try { state.artifacts[id] = await fetch('/api/task/' + id + '/artifacts').then((x) => x.json()) } catch {}
        setPane('detail'); renderBoard(); renderDetail()
      }
      function selectFirstReview() { selectFirst('awaiting-approval') }
      function selectFirst(status) { const t = tasks().find((x) => x.status === status); if (t) selectTask(t.id) }

      function renderDetail() {
        const el = document.getElementById('detail'); const t = state.sel && task(state.sel)
        if (!t) { el.innerHTML = '<div class="detail"><div class="empty">Select a task to see its pipeline, diff, and review actions.</div></div>'; return }
        const a = state.artifacts[t.id] || {}
        const doneIdx = t.lastCompletedStage ? STAGES.indexOf(t.lastCompletedStage) : -1
        const strip = STAGES.map((s, i) => {
          const cls = t.stage === s ? 'active' : i <= doneIdx ? 'done' : ''
          return '<div class="stage ' + cls + '">' + s + '</div>'
        }).join('')

        const finished = ['awaiting-approval', 'merged', 'blocked', 'failed'].includes(t.status)
        const reviewEvi = finished ? (a.reviewNotes
          ? '<div class="evi"><span class="vtag">Review</span> — ' + esc(a.reviewNotes.slice(0, 600)) + '</div>'
          : '<div class="evi"><span class="vtag" style="color:var(--green)">Review</span> — passed, no findings</div>') : ''
        const testOk = t.status !== 'blocked' && t.status !== 'failed'
        const testEvi = finished ? (a.testEvidence
          ? '<div class="evi ' + (testOk ? 'verified' : 'unverified') + '"><span class="vtag">' + (testOk ? '✓ Test' : '⚠ Test') + '</span> — ' + esc(a.testEvidence.slice(0, 500)) + '</div>'
          : '<div class="evi unverified"><span class="vtag">⚠ Not verified</span> — no runtime test ran for this change</div>') : ''
        const testShot = a.testScreenshot ? '<div class="lbl">Browser test — what it actually rendered</div><img src="data:image/png;base64,' + a.testScreenshot + '" alt="screenshot" style="width:100%;border:1px solid var(--border);border-radius:9px;display:block" />' : ''

        const blocked = a.blockReason ? '<div class="lbl">Needs you</div><div class="blocked-note">' + esc(a.blockReason) + '</div>' : ''
        const pr = t.prUrl ? '<div class="lbl">PR</div><div class="pr">' + esc(t.prUrl) + '</div>' : ''
        const diff = a.diff ? '<div class="lbl">Changes</div>' + renderDiff(a.diff) : ''
        const transcript = (state.transcripts[t.id] || []).join('\n')
        const tr = transcript ? '<div class="lbl">Agent activity</div><div class="transcript">' + esc(transcript) + '</div>' : ''

        const abandonLabel = state.pendingAbandon === t.id ? 'Click again to confirm' : 'Abandon'
        let actions = ''
        if (t.status === 'awaiting-approval') {
          actions = '<div class="actions"><button class="green" onclick="approve(\'' + t.id + '\')">' + icon('check') + 'Approve &amp; Merge</button>' +
            '<button class="ghost" onclick="toggleRC()">Request changes</button>' +
            '<button class="danger" onclick="abandon(\'' + t.id + '\')">' + abandonLabel + '</button></div>' + rcBox(t.id)
        } else if (['blocked', 'failed'].includes(t.status)) {
          actions = '<div class="actions"><button class="ghost" onclick="toggleRC()">Retry with guidance</button>' +
            '<button class="danger" onclick="abandon(\'' + t.id + '\')">' + abandonLabel + '</button></div>' + rcBox(t.id)
        } else if (t.status === 'merged') {
          actions = '<div class="actions"><span class="badge dot b-merged" style="padding:5px 11px">Merged ✓</span>' +
            '<button class="ghost sm" onclick="openPreview()">' + icon('eye') + ' View result</button></div>'
        } else if (t.status === 'proposed') {
          actions = '<div class="actions"><button class="green" onclick="accept(\'' + t.id + '\')">' + icon('play') + 'Accept &amp; run</button>' +
            '<button class="danger" onclick="dismiss(\'' + t.id + '\')">Dismiss</button></div>'
        }

        el.innerHTML = '<div class="detail"><h2>' + esc(t.title) + '</h2>' +
          '<div class="row">' + statusBadgeHtml(t) + (t.origin === 'scout' ? '<span class="badge scout">scout</span>' : '') + '</div>' +
          '<div class="strip">' + strip + '</div>' +
          (t.rationale ? '<div class="lbl">Why</div><div class="spec">' + esc(t.rationale) + '</div>' : '') +
          '<div class="lbl">Spec</div><div class="spec">' + esc(t.description || '') + '</div>' +
          actions + blocked + reviewEvi + (reviewEvi ? '<div style="height:6px"></div>' : '') + testEvi + testShot + pr + diff + tr + '</div>'
      }

      function rcBox(id) {
        return '<div class="rc-box ' + (state.rcOpen ? 'open' : '') + '"><textarea id="rcText" placeholder="What should change? (this re-runs the pipeline with your guidance)" rows="3" style="width:100%"></textarea>' +
          '<div style="margin-top:8px;display:flex;gap:8px"><button class="sm" onclick="submitRC(\'' + id + '\')">Submit</button><button class="ghost sm" onclick="toggleRC()">Cancel</button></div></div>'
      }
      function toggleRC() { state.rcOpen = !state.rcOpen; renderDetail(); if (state.rcOpen) { const r = document.getElementById('rcText'); if (r) r.focus() } }
      async function submitRC(id) {
        const comments = (document.getElementById('rcText').value || '').trim(); if (!comments) return
        state.rcOpen = false
        await fetch('/api/task/' + id + '/request-changes', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ comments }) })
      }
      async function approve(id) { await fetch('/api/task/' + id + '/approve', { method: 'POST' }) }
      async function accept(id) { await fetch('/api/task/' + id + '/accept', { method: 'POST' }) }
      async function dismiss(id) { await fetch('/api/task/' + id + '/dismiss', { method: 'POST' }) }
      async function abandon(id) {
        // Two-step confirm, stored in state so SSE re-renders don't wipe it.
        if (state.pendingAbandon !== id) {
          state.pendingAbandon = id; renderDetail()
          setTimeout(() => { if (state.pendingAbandon === id) { state.pendingAbandon = null; renderDetail() } }, 3000)
          return
        }
        state.pendingAbandon = null
        await fetch('/api/task/' + id + '/abandon', { method: 'POST' })
      }

      function renderDiff(diff) {
        const files = diff.split(/^diff --git /m).filter(Boolean)
        return files.map((f, i) => {
          const fname = (f.match(/a\/(\S+) b\//) || [, 'changed file'])[1]
          const lines = ('diff --git ' + f).split('\n').map((l) =>
            l.startsWith('+') && !l.startsWith('+++') ? '<span class="dl-add">' + esc(l) + '</span>' :
            l.startsWith('-') && !l.startsWith('---') ? '<span class="dl-del">' + esc(l) + '</span>' :
            l.startsWith('@@') ? '<span class="dl-hunk">' + esc(l) + '</span>' : esc(l)
          ).join('\n')
          return '<details class="filediff" ' + (files.length === 1 ? 'open' : '') + '><summary>' + esc(fname) + '</summary><pre>' + lines + '</pre></details>'
        }).join('')
      }

      // ---- narrow pane switching ----
      function setPane(p) {
        state.pane = p
        document.querySelectorAll('#tabs button').forEach((b) => b.classList.toggle('active', b.dataset.pane === p))
        const map = { board: 'col-board', main: 'col-main', detail: 'col-detail' }
        document.querySelectorAll('.col').forEach((c) => c.classList.remove('active'))
        document.getElementById(map[p]).classList.add('active')
      }

      // ---- Toasts: nudge when the machine needs you (transitions in SSE state) ----
      function processToasts() {
        const ts = tasks()
        let merged = false
        if (state.prevStatuses) {
          for (const t of ts) {
            const was = state.prevStatuses[t.id]
            if (was && was !== t.status) {
              if (t.status === 'awaiting-approval') toast('review', t.title, 'ready for your review', t.id)
              else if (t.status === 'blocked' || t.status === 'failed') toast('blocked', t.title, 'needs attention', t.id)
              else if (t.status === 'merged') { toast('merged', t.title, 'merged ✓', null); merged = true }
            }
          }
        }
        state.prevStatuses = Object.fromEntries(ts.map((t) => [t.id, t.status]))
        if (merged) refreshPreview() // a change just landed on main — update any open preview
      }
      function refreshPreview() {
        const nonce = nextNonce()
        const fs = document.getElementById('fsPreview')
        if (state.previewFullscreen && fs) { const f = fs.querySelector('iframe'); if (f) f.src = '/preview/index.html?_=' + nonce }
        else if (state.view === 'preview') { const f = document.querySelector('#mainBody iframe'); if (f) f.src = '/preview/index.html?_=' + nonce }
      }
      function toast(kind, title, sub, taskId) {
        const el = document.createElement('div')
        el.className = 'toast ' + kind
        el.innerHTML = '<div><div class="tt">' + esc(title) + '</div><div class="ts">' + sub + '</div></div>'
        el.onclick = () => { if (taskId) selectTask(taskId); el.remove() }
        document.getElementById('toasts').appendChild(el)
        setTimeout(() => el.remove(), kind === 'merged' ? 3500 : 9000)
      }

      function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])) }

      // expose
      Object.assign(window, { selectTask, selectFirstReview, selectFirst, openDoc, backToChat, goChat, openRun, runCmd, openPreview, refreshPreview, toggleFullscreen, toggleHelp, saveDoc, approve, accept, dismiss, abandon, toggleRC, submitRC, useExample, setPane, send, copyCode, openFolderPicker, fpBrowse, fpGoTyped, fpConfirm })
      // ---- Keyboard shortcuts (skip while typing in a field) ----
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') { const fp = document.getElementById('fp'); if (fp) return fp.remove(); if (document.getElementById('help')) return toggleHelp(); if (state.previewFullscreen) return toggleFullscreen() }
        const tag = (e.target.tagName || '').toLowerCase()
        if (tag === 'input' || tag === 'textarea' || e.metaKey || e.ctrlKey || e.altKey) return
        if (e.key === '?') { e.preventDefault(); return toggleHelp() }
        const ts = tasks()
        const idx = ts.findIndex((t) => t.id === state.sel)
        if (e.key === 'j' && ts.length) { e.preventDefault(); selectTask(ts[idx < 0 ? 0 : Math.min(ts.length - 1, idx + 1)].id) }
        else if (e.key === 'k' && ts.length) { e.preventDefault(); selectTask(ts[idx < 0 ? 0 : Math.max(0, idx - 1)].id) }
        else if (e.key === 'a') { const t = task(state.sel); if (t && t.status === 'awaiting-approval') approve(t.id) }
        else if (e.key === 'r') { const t = task(state.sel); if (t && ['awaiting-approval', 'blocked', 'failed'].includes(t.status)) { state.rcOpen = true; renderDetail(); const r = document.getElementById('rcText'); if (r) r.focus() } }
        else if (e.key === 'p') { e.preventDefault(); openPreview() }
        else if (e.key === 'c') { e.preventDefault(); goChat(); const i = document.getElementById('chatInput'); if (i) i.focus() }
      })

      // Restore the persisted chat transcript so the conversation survives reloads.
      loadChatHistory()

      renderMain()
      setPane('main') // sync the narrow-mode switcher with the visible pane on load
    </script>
  </body>
</html>
